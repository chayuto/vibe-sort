AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'bin/**/*'
    - 'tmp/**/*'

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

Metrics/MethodLength:
  Enabled: false

Layout/LineLength:
  Enabled: false

# The System One strategies are small state machines around a remote model; splitting
# them further to satisfy size metrics hurts readability more than it helps.
Metrics/AbcSize:
  Exclude:
    - 'lib/vibe_sort/system_one/**/*'
    - 'lib/vibe_sort/provider_resolver.rb'
    - 'lib/vibe_sort/providers/jev.rb'
Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/vibe_sort/system_one/**/*'
    - 'lib/vibe_sort/provider_resolver.rb'
    - 'lib/vibe_sort/providers/jev.rb'
Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/vibe_sort/system_one/**/*'
    - 'lib/vibe_sort/provider_resolver.rb'
    - 'lib/vibe_sort/providers/jev.rb'
Metrics/ClassLength:
  Exclude:
    - 'lib/vibe_sort/system_one/**/*'

# Keyword arguments are the idiomatic way to take many options in Ruby
Metrics/ParameterLists:
  CountKeywordArgs: false
